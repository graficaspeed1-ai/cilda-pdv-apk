name: Build CILDA Vendas APK - KitKat local assets v3

on:
  workflow_dispatch:
  push:
    branches: [cilda-vendas-build]
    paths:
      - 'cilda-vendas-projeto-android.zip'
      - '.github/workflows/build-cilda-vendas-apk.yml'
      - 'scripts/configure-sm-t561m.py'

permissions:
  contents: read

jobs:
  build-vendas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch CILDA Vendas
        uses: actions/checkout@v4

      - name: Verify uploaded Android project
        run: |
          test -s cilda-vendas-projeto-android.zip
          unzip -t cilda-vendas-projeto-android.zip

      - name: Extract Android project
        run: |
          mkdir -p _cilda_vendas_project
          unzip -q cilda-vendas-projeto-android.zip -d _cilda_vendas_project
          PROJECT_DIR="$(find "$PWD/_cilda_vendas_project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Não foi encontrado settings.gradle no ZIP."
            find _cilda_vendas_project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto Android encontrado em: $PROJECT_DIR"

      - name: Apply Samsung SM-T561M settings
        run: python3 scripts/configure-sm-t561m.py "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build CILDA Vendas APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/CILDA-Vendas-debug.apk"

      - name: Upload CILDA Vendas APK
        uses: actions/upload-artifact@v4
        with:
          name: CILDA-VENDAS-APK
          path: output/CILDA-Vendas-debug.apk
          if-no-files-found: error

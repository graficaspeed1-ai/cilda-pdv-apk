name: Build CILDA PDV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript transpiler
        run: npm install --global typescript@5.8.3

      - name: Fetch and transpile PDV scripts for Android 4.4.4
        run: TSC_BIN="$(command -v tsc)" bash tools/prepare-android44-assets.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CILDA-PDV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

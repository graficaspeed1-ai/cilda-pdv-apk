<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CILDA Biju</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{--bg:#F4F1F7;--panel:#fff;--ink:#2B2040;--mute:#6E6585;--line:#E2DCEB;--accent:#B83A74;--aink:#fff;--gold:#9A6B1F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#19131F;--panel:#241C2E;--ink:#F1ECF7;--mute:#A99FBD;--line:#382E47;--accent:#E0689A;--aink:#1a0f16;--gold:#E0B25C}}
:root[data-theme="dark"]{--bg:#19131F;--panel:#241C2E;--ink:#F1ECF7;--mute:#A99FBD;--line:#382E47;--accent:#E0689A;--aink:#1a0f16;--gold:#E0B25C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "DM Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font:600 22px "Fraunces",Georgia,serif}
.logo{margin:0;display:flex;align-items:center;line-height:0}
.logo img{height:64px;width:auto;display:block;border-radius:12px}

.stat{color:var(--mute);font-size:14px}.stat b{color:var(--ink)}
main{display:grid;grid-template-columns:1fr 380px;gap:20px;padding:20px;max-width:1300px;margin:0 auto}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
#q{flex:1 1 220px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:4px;min-height:132px}
.card:hover{border-color:var(--accent)}
.card[disabled]{opacity:.45;cursor:not-allowed}
.nm{font-weight:700}.sku{color:var(--mute);font-size:12px}
.pr{font:600 20px "Fraunces",Georgia,serif;margin-top:auto}
.tag{font-size:12px;color:var(--accent);font-weight:500}.low{font-size:12px;color:var(--gold);font-weight:500}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start;position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
aside h2{margin:0;font:600 18px "Fraunces",Georgia,serif}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.it{padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.mute{color:var(--mute);font-size:13px}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.tot{font:600 28px "Fraunces",Georgia,serif;color:var(--gold)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pays .chip{border-radius:10px}
aside input[type=number]{width:90px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;text-align:right}
.go{padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--aink);font-weight:700;font-size:16px}
.go:disabled{opacity:.4;cursor:not-allowed}
.sw{display:flex;align-items:center;gap:8px}
#modal{position:fixed;inset:0;background:rgba(20,10,30,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal.on{display:flex}
.box{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.box button.v{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.box button.v:hover:not([disabled]){border-color:var(--accent)}
.box button.v[disabled]{opacity:.4;cursor:not-allowed}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
#bar{display:none}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.box.wide{max-width:560px;max-height:88vh;overflow:auto}
.box input:not([type=checkbox]){padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
.box textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:12px/1.4 monospace}
.pimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:4px;background:var(--bg)}
.box video{width:100%;border-radius:10px;background:#000}
.box select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
table{width:100%;border-collapse:collapse}td{padding:7px 4px;border-bottom:1px solid var(--line)}
th{text-align:left;padding:6px 4px;border-bottom:2px solid var(--line);font-weight:600}th.r,td.r{text-align:right}
#rep h3{margin:16px 0 4px;font:600 15px "Fraunces",Georgia,serif}
[hidden]{display:none!important}
@media print{body.pr-rep #rep{display:block!important}body.pr-rep #rep,body.pr-rep #rep *{color:#000!important;background:none!important}}
#sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.lab{border:1px dashed #888;padding:1.5mm;font-size:9pt;text-align:center;color:#000;background:#fff;line-height:1.15;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.lab div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab svg{height:auto;flex:1 1 0;min-height:0}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block;padding:0}.box,.box.wide{max-width:none;max-height:none;padding:0;background:none}.box>*:not(#sheet){display:none!important}}
.tab{padding:10px 14px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;color:var(--mute)}
.tab[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
#home{max-width:1100px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#0b0710,#2a0f22 70%,#3a1530);color:#fff;border-color:#3a2a44}
.hero h2{margin:4px 0 14px;font:600 26px "Fraunces",Georgia,serif}
.hero-logo{width:230px;height:230px;object-fit:contain;flex:none;filter:drop-shadow(0 0 22px rgba(244,198,218,.3))}
.hero .mute{color:#d8cde6}
.hero .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts .go{padding:14px 22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi,.pnl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.pnl{display:flex;flex-direction:column;gap:8px}
.kv{font:600 26px "Fraunces",Georgia,serif;color:var(--gold)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.short{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:500}
.sbtn span{font-size:26px}.sbtn:hover{border-color:var(--accent)}
.hb{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb b{text-align:right}
.box h3{margin:14px 0 4px;font:600 15px "Fraunces",Georgia,serif}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0;color:var(--mute)}
kbd{font:600 12px/1 monospace;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
@media (pointer:coarse){.chip,.go,.sbtn{min-height:44px}.chip{padding:10px 16px}}
@media (max-width:900px){
main{grid-template-columns:1fr;padding:14px 14px 90px}
aside{position:fixed;inset:auto 0 0 0;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .2s;z-index:15;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
aside.open{transform:none}
#bar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;padding:14px 18px;border:0;border-radius:14px;background:var(--accent);color:var(--aink);font-weight:700;z-index:10}
}
@media (prefers-reduced-motion:reduce){aside,#toast{transition:none}}
</style>
</head>

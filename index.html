cart.forEach(function(i){var p=pf(i.c);if(p.v){var x=fnd(p.v,function(x){return x.n==i.v});x.s=Math.max(0,x.s-i.q)}});
sv('s',S);sv('p2',P);cart=[];$('#dc').value=0;$('#at').checked=false;rAll();toast('Venda #'+pad(n)+' registrada');if(cfg.auto)printTxt(rcpt(sale))}
